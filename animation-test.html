<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animação de Entrega - Instituto Galvão Azevedo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 800px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 2rem;
    }

    .animation-wrapper {
      background: linear-gradient(to bottom, #f0f4ff, #ffffff);
      border-radius: 15px;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
      border: 2px solid #e0e0e0;
      position: relative;
      overflow: hidden;
    }

    svg {
      width: 100%;
      max-width: 600px;
      height: auto;
    }

    /* Animações */
    @keyframes walk-in {
      0% { transform: translateX(-150px); }
      100% { transform: translateX(0); }
    }

    @keyframes walk-out {
      0% { transform: translateX(0); }
      100% { transform: translateX(-150px); }
    }

    @keyframes box-transfer {
      0% { transform: translateX(-80px); }
      50% { transform: translateX(0); }
      100% { transform: translateX(80px); }
    }

    @keyframes stand-up {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50px); }
    }

    @keyframes celebrate {
      0%, 100% { transform: translateY(-50px) scaleY(1); }
      25% { transform: translateY(-50px) scaleY(1) rotateZ(-8deg); }
      50% { transform: translateY(-50px) scaleY(1) rotateZ(8deg); }
      75% { transform: translateY(-50px) scaleY(1) rotateZ(-8deg); }
    }

    @keyframes arms-up {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-45deg); }
    }

    @keyframes arms-up-right {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(45deg); }
    }

    @keyframes heart-float {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) scale(0.3);
        opacity: 0;
      }
    }

    /* Aplicar animações */
    #person-left {
      animation: walk-in 1s ease-in-out 0s forwards, walk-out 1s ease-in-out 7s forwards;
    }

    #box-transfer {
      animation: box-transfer 1s ease-in-out 1s forwards, stand-up 0.5s ease-in-out 1.5s forwards, celebrate 1s ease-in-out 3s forwards, stand-up 0.5s ease-in-out 7s reverse;
    }

    #person-right {
      animation: stand-up 0.5s ease-in-out 1.5s forwards, celebrate 1s ease-in-out 3s forwards, stand-up 0.5s ease-in-out 7s reverse;
    }

    #arm-left-right {
      transform-origin: 485px 115px;
      animation: arms-up 1s ease-in-out 3s forwards;
    }

    #arm-right-right {
      transform-origin: 515px 115px;
      animation: arms-up-right 1s ease-in-out 3s forwards;
    }

    .heart-float {
      animation: heart-float 2s ease-out forwards;
    }

    .info {
      text-align: center;
      margin-top: 30px;
      color: #666;
      font-size: 0.95rem;
    }

    .info p {
      margin: 10px 0;
    }

    .btn-container {
      text-align: center;
      margin-top: 20px;
    }

    .btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .animation-wrapper {
        padding: 20px;
        min-height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎁 Animação de Entrega</h1>
    
    <div class="animation-wrapper">
      <svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
        <!-- Fundo com chão -->
        <rect x="0" y="250" width="600" height="50" fill="#e8f5e9" />
        <line x1="0" y1="250" x2="600" y2="250" stroke="#4caf50" stroke-width="2" />

        <!-- Pessoa 1 (Esquerda - Entregador) -->
        <g id="person-left">
          <!-- Cabeça -->
          <circle cx="100" cy="80" r="20" fill="#FF9800" />
          <!-- Corpo -->
          <rect x="85" y="105" width="30" height="40" rx="5" fill="#2196F3" />
          <!-- Braço esquerdo -->
          <line x1="85" y1="115" x2="60" y2="90" stroke="#FF9800" stroke-width="4" stroke-linecap="round" />
          <!-- Braço direito (estendido) -->
          <line x1="115" y1="115" x2="150" y2="100" stroke="#FF9800" stroke-width="4" stroke-linecap="round" />
          <!-- Perna esquerda -->
          <line x1="90" y1="145" x2="90" y2="180" stroke="#333" stroke-width="4" stroke-linecap="round" />
          <!-- Perna direita -->
          <line x1="100" y1="145" x2="100" y2="180" stroke="#333" stroke-width="4" stroke-linecap="round" />
        </g>

        <!-- Caixa que se move entre os bonecos -->
        <g id="box-transfer">
          <rect x="140" y="85" width="50" height="45" rx="3" fill="#8BC34A" stroke="#7CB342" stroke-width="2" />
          <!-- Fita da caixa -->
          <rect x="140" y="105" width="50" height="4" fill="#FF5722" />
          <!-- Laço -->
          <circle cx="165" cy="105" r="6" fill="#FF5722" />
        </g>

        <!-- Pessoa 2 (Direita - Recebedor) - SENTADO INICIALMENTE -->
        <g id="person-right">
          <!-- Cabeça -->
          <circle cx="500" cy="120" r="20" fill="#4CAF50" />
          <!-- Corpo (sentado) -->
          <rect x="485" y="145" width="30" height="35" rx="5" fill="#FF6B6B" />
          <!-- Braço esquerdo (recebendo) -->
          <line id="arm-left-right" x1="485" y1="155" x2="450" y2="130" stroke="#FF9800" stroke-width="4" stroke-linecap="round" />
          <!-- Braço direito -->
          <line id="arm-right-right" x1="515" y1="155" x2="540" y2="130" stroke="#FF9800" stroke-width="4" stroke-linecap="round" />
          <!-- Perna esquerda (sentado) -->
          <line x1="490" y1="180" x2="490" y2="210" stroke="#333" stroke-width="4" stroke-linecap="round" />
          <!-- Perna direita (sentado) -->
          <line x1="500" y1="180" x2="500" y2="210" stroke="#333" stroke-width="4" stroke-linecap="round" />
        </g>

        <!-- Container para corações -->
        <g id="hearts-container"></g>

        <!-- Texto no centro -->
        <text x="300" y="230" font-size="18" text-anchor="middle" fill="#333" font-weight="bold">
          Ajudando Sem Julgar
        </text>
      </svg>
    </div>

    <div class="info">
      <p><strong>Instituto Galvão Azevedo</strong></p>
      <p>Uma ONG que une forças para apoiar outras organizações sociais</p>
    </div>

    <div class="btn-container">
      <button class="btn" onclick="window.location.href='index.html'">
        ← Voltar ao Site
      </button>
    </div>
  </div>

  <script>
    // Criar corações flutuantes no momento da comemoração
    function createFloatingHearts() {
      const hearts = ['❤️', '💚', '💙', '🧡', '💛'];
      const container = document.getElementById('hearts-container');
      
      // Criar corações a cada 8 segundos (no momento da comemoração)
      setInterval(() => {
        // Criar 5 corações em sequência
        for (let i = 0; i < 5; i++) {
          setTimeout(() => {
            const heart = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            const randomHeart = hearts[Math.floor(Math.random() * hearts.length)];
            const randomX = 450 + Math.random() * 100;
            
            heart.setAttribute('x', randomX);
            heart.setAttribute('y', '150');
            heart.setAttribute('font-size', '28');
            heart.setAttribute('text-anchor', 'middle');
            heart.textContent = randomHeart;
            heart.classList.add('heart-float');
            
            container.appendChild(heart);
            
            // Remover após animação
            setTimeout(() => heart.remove(), 2000);
          }, i * 200);
        }
      }, 8000);
      
      // Criar primeira sequência imediatamente após 3 segundos
      setTimeout(() => {
        for (let i = 0; i < 5; i++) {
          setTimeout(() => {
            const heart = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            const randomHeart = hearts[Math.floor(Math.random() * hearts.length)];
            const randomX = 450 + Math.random() * 100;
            
            heart.setAttribute('x', randomX);
            heart.setAttribute('y', '150');
            heart.setAttribute('font-size', '28');
            heart.setAttribute('text-anchor', 'middle');
            heart.textContent = randomHeart;
            heart.classList.add('heart-float');
            
            container.appendChild(heart);
            
            setTimeout(() => heart.remove(), 2000);
          }, i * 200);
        }
      }, 3000);
    }

    // Iniciar animação de corações quando a página carregar
    window.addEventListener('load', createFloatingHearts);
  </script>
</body>
</html>
